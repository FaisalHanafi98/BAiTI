# Explicit native test properties are registered only after target/role preflight.
server:
  address: 127.0.0.1

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: baiti-test-pool
      maximum-pool-size: 5
  jpa:
    show-sql: false

logging:
  level:
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: WARN

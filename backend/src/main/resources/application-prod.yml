# Prod profile: NO secret defaults. A missing env var must cause startup failure (by design).
# Provide all DB_APP_*, DB_MIGRATOR_*, JWT_* and runtime vars via the platform secret store (P18).
baiti:
  tenancy:
    base-domain: ${APP_BASE_DOMAIN}

server:
  forward-headers-strategy: none

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: baiti-app-pool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 20000
      leak-detection-threshold: 30000
  flyway:
    url: ${DB_URL}
    user: ${DB_MIGRATOR_USER}
    password: ${DB_MIGRATOR_PASSWORD}
  jpa:
    show-sql: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    my.baiti: INFO
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: INFO
